# Build versioned service images only. Terraform deployment is run locally by
# an authenticated project operator, not by Cloud Build's restricted default SA.
substitutions:
  _REGION: us-central1
  _REGISTRY: churnops-docker
  _TAG: demo

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-generator
    args: ['build', '-f', 'data/generator/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/generator:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-ingest
    args: ['build', '-f', 'data/ingest/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/ingest:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-drift
    args: ['build', '-f', 'data/drift/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/drift:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-serving
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/serving:${_TAG}', 'ml/serving']
  - name: gcr.io/cloud-builders/docker
    id: build-analyst
    args: ['build', '-f', 'llm/analyst/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/analyst:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    id: build-trigger
    args: ['build', '-f', 'ops/trigger_fn/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/trigger:${_TAG}', 'ops/trigger_fn']

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/generator:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/ingest:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/drift:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/serving:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/analyst:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REGISTRY}/trigger:${_TAG}'

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
