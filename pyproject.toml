[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churnops"
version = "1.0.0"
description = "Automated Churn Pipeline with Drift Alerts on GCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pandera>=0.18.0",
    "pyyaml>=6.0.1",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "joblib>=1.3.2",
    "jsonschema>=4.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "kfp>=2.7.0"
]

[tool.ruff]
line-length = 120
target-version = "py310"   # matches requires-python; datetime.UTC is 3.11+

[tool.ruff.lint]
# Pinned so `make lint` means the same thing on every machine and ruff version.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI dependency defaults
    "UP007",   # keep Optional[...] where it reads better in generated API models
    "UP015",   # explicit open(..., "r") matches the style used across the repo
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
